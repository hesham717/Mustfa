name: Arena APK release

on:
  push:
    branches:
      - arena/01a0990a-mustfa
    # Only rebuild when the app itself changes, so documentation or workflow
    # edits do not publish an identical APK again.
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests (player gestures)
        run: ./gradlew --no-daemon -PskipGoogleServices :app:testFdroidDebugUnitTest --tests '*PlayerGestureTrackerTest*' --tests '*DependencyPinsTest*' --stacktrace

      - name: Build fdroid debug + release APKs
        run: ./gradlew --no-daemon -PskipGoogleServices :app:assembleFdroidDebug :app:assembleFdroidRelease --stacktrace

      - name: Prepare APKs
        id: apk
        run: |
          set -e
          DEBUG_APK=$(find app/build/outputs/apk/fdroid/debug -name "*.apk" | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/fdroid/release -name "*.apk" | head -1)
          echo "debug=$DEBUG_APK release=$RELEASE_APK"
          cp "$DEBUG_APK" Mustfa-debug.apk
          cp "$RELEASE_APK" Mustfa-release.apk
          ls -lh Mustfa-debug.apk Mustfa-release.apk
          sha256sum Mustfa-debug.apk Mustfa-release.apk | tee apk-sha256.txt
          echo "sha256=$(head -1 apk-sha256.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256_release=$(tail -1 apk-sha256.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          SHA256_RELEASE: ${{ steps.apk.outputs.sha256_release }}
        run: |
          set -e
          NOTES=$(cat <<EOF
          APKs built from commit ${GITHUB_SHA} on branch \`arena/01a0990a-mustfa\` (fdroid flavour, no Google services).

          * **Mustfa-debug.apk** - app id \`com.droidtechlab.filemanager.debug\`, installs next to any existing install.
            SHA-256: \`${SHA256}\`
          * **Mustfa-release.apk** - minified, signed with the repo test keystore, app id \`com.droidtechlab.filemanager\`.
            SHA-256: \`${SHA256_RELEASE}\`

          This is a test build, not an official release.
          EOF
          )
          gh release create "$TAG" Mustfa-debug.apk Mustfa-release.apk \
            --target "$GITHUB_SHA" \
            --title "Test build $TAG" \
            --notes "$NOTES" \
            --prerelease
          gh release view "$TAG" --json assets --jq '.assets[].name'
