name: Android APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to build
        required: true
        default: 43bb205d1fb2ad88501f0288482514c7c763a30d
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v4

      - name: Check out requested source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '43bb205d1fb2ad88501f0288482514c7c763a30d' }}

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build fdroid debug APK
        run: ./gradlew --no-daemon :app:assembleFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error